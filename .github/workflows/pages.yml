name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate content and verify reference solutions
        run: python3 scripts/build_content.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        working-directory: site
        run: npm ci
      - name: Typecheck
        working-directory: site
        run: npx tsc -b
      - name: Playwright version
        id: pw
        working-directory: site
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright browser
        working-directory: site
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
      # The site is served at a custom domain (site/public/CNAME), so it lives
      # at the root path. GitHub redirects the old github.io address to it.
      - name: Site address
        run: |
          echo "VITE_BASE=/" >> "$GITHUB_ENV"
          echo "SITE_URL=https://$(cat site/public/CNAME)/" >> "$GITHUB_ENV"
      - name: Build site (with pre-rendered pages, sitemap and robots)
        working-directory: site
        run: npm run build
      - name: Browser checks (smoke tests, content sweep, pre-rendered pages)
        working-directory: site
        run: npx playwright test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
